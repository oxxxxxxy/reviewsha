namespace: reviewsha
env:
  NODE_ENV: production
  API_PORT: '3000'
  API_PREFIX: api/v1
  REDIS_URL: redis://redis.example.internal:6379
  REDIS_HOST: redis.example.internal
  REDIS_PORT: '6379'
  MINIO_ENDPOINT: https://object.example.internal
  OMNIROUTE_DASHBOARD_URL: https://omniroute.example.com
  CORS_ORIGINS: https://app.example.com,https://admin.example.com
images:
  api:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-api,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  worker:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-worker,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  web:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-web,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  admin:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-admin,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
replicas: { api: 2, worker: 2, web: 2, admin: 2 }
omniroute:
  enabled: true
  image: { repository: ghcr.io/diegosouzapw/omniroute, tag: replace-with-git-sha, pullPolicy: IfNotPresent }
  replicas: 2
  port: 20128
  existingSecret: reviewsha-omniroute-secrets
  persistence: { enabled: false, size: 10Gi, storageClass: '' }
ingress: { enabled: true, className: nginx, host: reviewsha.example.com, tls: true }
secrets:
  create: false
  existingSecret: reviewsha-secrets
resources:
  api:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  worker:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '2', memory: 2Gi }
  web:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  admin:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
