namespace: reviewsha
env:
  NODE_ENV: production
  API_PORT: '3000'
  API_PREFIX: api/v1
  REDIS_URL: redis://redis.example.internal:6379
  MINIO_ENDPOINT: https://object.example.internal
  CORS_ORIGINS: https://app.example.com,https://admin.example.com
images:
  api:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-api,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  worker:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-worker,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  web:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-web,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
  admin:
    {
      repository: ghcr.io/oxxxxxxy/reviewsha-admin,
      tag: replace-with-git-sha,
      pullPolicy: IfNotPresent,
    }
replicas: { api: 2, worker: 1, web: 2, admin: 1 }
ingress: { enabled: true, className: nginx, host: reviewsha.example.com, tls: true }
secrets:
  create: false
  existingSecret: reviewsha-secrets
resources:
  api:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  worker:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '2', memory: 2Gi }
  web:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  admin:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
