apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reviewsha.fullname" . }}-migrations
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reviewsha
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrations
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["sh", "-c"]
          args: ["cd apps/api && ../../node_modules/.bin/prisma migrate deploy"]
          envFrom:
            - configMapRef: { name: {{ include "reviewsha.fullname" . }}-config }
            - secretRef: { name: {{ default .Values.secretName .Values.secrets.existingSecret }} }
          resources:
{{- toYaml (default dict .Values.resources.api) | nindent 12 }}
