{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default .Values.secretName .Values.secrets.existingSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JWT_SECRET: replace-me
  JWT_REFRESH_SECRET: replace-me
  INTERNAL_API_KEY: replace-me
  DATABASE_URL: replace-me
  REDIS_URL: replace-me
  MINIO_ACCESS_KEY: replace-me
  MINIO_SECRET_KEY: replace-me
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  OMNIROUTER_API_KEY: replace-me
  OMNIROUTER_BASE_URL: http://omniroute:20128/v1
  AI_PROVIDER: deepseek
  AI_MODEL: auto/best-coding
{{- end }}
