{{- range $name := list "api" "worker" "web" "admin" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reviewsha.fullname" $ }}-{{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ index $.Values.replicas $name }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: reviewsha, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reviewsha, app.kubernetes.io/component: {{ $name }} }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: reviewsha
                    app.kubernetes.io/component: {{ $name }}
      imagePullSecrets:
{{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- if and (eq $name "worker") $.Values.worker.persistence.enabled }}
      initContainers:
        - name: prepare-worker-workspace
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /tmp/reviewsha/jobs && chown -R 10001:10001 /tmp/reviewsha"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: worker-workspace
              mountPath: /tmp/reviewsha
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ (index $.Values.images $name).repository }}:{{ (index $.Values.images $name).tag }}"
          imagePullPolicy: {{ (index $.Values.images $name).pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "reviewsha.fullname" $ }}-config }
            - secretRef: { name: {{ default $.Values.secretName $.Values.secrets.existingSecret }}, optional: true }
          {{- if and (eq $name "worker") $.Values.worker.persistence.enabled }}
          volumeMounts:
            - name: worker-workspace
              mountPath: /tmp/reviewsha
          {{- end }}
          {{- if or (eq $name "api") (eq $name "web") (eq $name "admin") }}
          ports:
            - name: http
              containerPort: {{ if eq $name "api" }}3000{{ else }}80{{ end }}
          {{- end }}
          {{- if eq $name "api" }}
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 5 }
          {{- else if or (eq $name "web") (eq $name "admin") }}
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3 }
          {{- end }}
          resources:
{{- toYaml (default dict (index $.Values.resources $name)) | nindent 12 }}
      {{- if and (eq $name "worker") $.Values.worker.persistence.enabled }}
      securityContext:
        fsGroup: 10001
      {{- end }}
      {{- if and (eq $name "worker") $.Values.worker.persistence.enabled }}
      volumes:
        - name: worker-workspace
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-worker-workspace" (include "reviewsha.fullname" $)) $.Values.worker.persistence.existingClaim }}
      {{- end }}
---
{{- end }}
