{{- if .Values.omniroute.enabled }}
{{- if .Values.omniroute.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "reviewsha.fullname" . }}-omniroute-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.omniroute.persistence.size }} }
  {{- if .Values.omniroute.persistence.storageClass }}
  storageClassName: {{ .Values.omniroute.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reviewsha.fullname" . }}-omniroute
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.omniroute.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: reviewsha, app.kubernetes.io/component: omniroute }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reviewsha, app.kubernetes.io/component: omniroute }
    spec:
      {{- if .Values.omniroute.seedConfigMap }}
      initContainers:
        - name: seed-omniroute-data
          image: busybox:1.36
          command:
            - sh
            - -ec
            - >-
              if [ ! -f /var/lib/omniroute/storage.sqlite ]; then
                gzip -dc /seed/storage.sqlite.gz > /var/lib/omniroute/storage.sqlite;
              fi;
              chown -R 1000:1000 /var/lib/omniroute;
              chmod -R u+rwX /var/lib/omniroute;
          volumeMounts:
            - { name: data, mountPath: /var/lib/omniroute }
            - { name: seed, mountPath: /seed, readOnly: true }
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: reviewsha
                    app.kubernetes.io/component: omniroute
      containers:
        - name: omniroute
          image: "{{ .Values.omniroute.image.repository }}:{{ .Values.omniroute.image.tag }}"
          imagePullPolicy: {{ .Values.omniroute.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.omniroute.port }} }]
          env:
            - { name: PORT, value: {{ .Values.omniroute.port | quote }} }
            - { name: DATA_DIR, value: /var/lib/omniroute }
          envFrom:
            - secretRef: { name: {{ .Values.omniroute.existingSecret }} }
          startupProbe:
            httpGet: { path: /v1/models, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /v1/models, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /v1/models, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts: [{ name: data, mountPath: /var/lib/omniroute }]
          resources:
{{- toYaml .Values.omniroute.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.omniroute.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "reviewsha.fullname" . }}-omniroute-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.omniroute.seedConfigMap }}
        - name: seed
          configMap: { name: {{ .Values.omniroute.seedConfigMap }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: {{ .Values.namespace }}
spec:
  selector: { app.kubernetes.io/name: reviewsha, app.kubernetes.io/component: omniroute }
  ports: [{ name: http, port: {{ .Values.omniroute.port }}, targetPort: http }]
{{- end }}
