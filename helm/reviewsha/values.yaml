namespace: reviewsha
imagePullSecrets: []

images:
  api: { repository: reviewsha-api, tag: dev, pullPolicy: IfNotPresent }
  worker: { repository: reviewsha-worker, tag: dev, pullPolicy: IfNotPresent }
  web: { repository: reviewsha-web, tag: dev, pullPolicy: IfNotPresent }
  admin: { repository: reviewsha-admin, tag: dev, pullPolicy: IfNotPresent }

replicas:
  api: 2
  worker: 2
  web: 2
  admin: 2

omniroute:
  enabled: true
  image: { repository: ghcr.io/diegosouzapw/omniroute, tag: latest, pullPolicy: IfNotPresent }
  replicas: 2
  port: 20128
  existingSecret: reviewsha-omniroute-secrets
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 2Gi }

resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  worker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  web:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  admin:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

env:
  NODE_ENV: production
  API_PORT: '3000'
  API_PREFIX: api/v1
  CORS_ORIGIN: http://app.reviewsha.test:18080,http://admin.reviewsha.test:18080
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  MINIO_ENDPOINT: ''
  OMNIROUTE_DASHBOARD_URL: http://localhost:20128
  # Reasoning-capable models need room for both hidden reasoning and the
  # structured JSON review response.
  AI_MAX_TOKENS: '6000'

secretName: reviewsha-secrets
secrets:
  create: false

services:
  api: { port: 3000 }
  web: { port: 80 }
  admin: { port: 80 }

ingress:
  enabled: false
  className: nginx
  host: reviewsha.local
  tls: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
