namespace: reviewsha-dev
images:
  api: { repository: reviewsha-api, tag: dev, pullPolicy: IfNotPresent }
  worker: { repository: reviewsha-worker, tag: dev, pullPolicy: IfNotPresent }
  web: { repository: reviewsha-web, tag: dev, pullPolicy: IfNotPresent }
  admin: { repository: reviewsha-admin, tag: dev, pullPolicy: IfNotPresent }
replicas: { api: 2, worker: 2, web: 2, admin: 2 }
worker:
  persistence:
    # The validation kind cluster has one node, so both worker replicas can
    # mount the local RWO volume. Production clusters should use RWX storage.
    enabled: true
    size: 10Gi
    accessModes: [ReadWriteOnce]
    storageClass: ''
    existingClaim: ''
ingress:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
omniroute:
  replicas: 2
  seedConfigMap: reviewsha-omniroute-seed
  persistence:
    # Two local pods cannot share the default single-node RWO volume.
    # Credentials/configuration are injected from the Secret.
    enabled: false
